[workspace]
members = [
  "crates/application",
  "crates/audio",
  "crates/domain",
  "crates/lexicon",
  "crates/model-manager",
  "crates/platform-windows",
  "crates/protocol",
  "crates/providers",
  "crates/storage",
  "crates/test-support",
  "apps/desktop/src-tauri",
  "apps/worker",
]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Maximiliantoepfer"]
repository = "https://github.com/Maximiliantoepfer/free-whisper"

[workspace.dependencies]
arboard = "3.6.1"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["multipart"] }
base64 = "0.22.1"
caseless = "0.2.2"
bytes = "1.11.1"
cpal = "0.17.3"
csv = "1.4.0"
ed25519-dalek = "2.2.0"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.4.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rubato = "0.16.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_jcs = "0.2.0"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.49.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
url = "2.5.8"
uuid = { version = "1.21.0", features = ["serde", "v4"] }
wavekat-vad = { version = "0.1.16", default-features = false, features = ["webrtc"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
