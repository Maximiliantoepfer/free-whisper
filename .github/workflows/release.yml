name: Signed Windows release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      FREE_WHISPER_MANIFEST_SIGNING_KEY: ${{ secrets.FREE_WHISPER_MANIFEST_SIGNING_KEY }}
      FREE_WHISPER_MANIFEST_SCOPE: stable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@a53b4f3246b1a3a8e53830a6f1c748b0955909e7
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: pnpm/action-setup@a748d99fc2de1a262e1640c2fc38e510b40f4e9f
        with:
          version: 11.19.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FREE_WHISPER_MANIFEST_SIGNING_KEY)) {
            throw 'FREE_WHISPER_MANIFEST_SIGNING_KEY is required for a release'
          }
          cargo run --locked -p free-whisper-model-manager --bin sign-model-manifest -- resources/models/manifest.json resources/models/manifest.sig resources/models/manifest.public-key --scope stable
          cargo run --locked -p free-whisper-model-manager --bin verify-model-manifest -- resources/models/manifest.json resources/models/manifest.sig resources/models/manifest.public-key --scope stable
      - shell: pwsh
        run: ./scripts/prepare-sidecars.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --features free-whisper-worker/test-fixture
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check --hide-inclusion-graph
      - run: pnpm ui:check
      - run: pnpm ui:test
      - shell: pwsh
        run: pnpm bindings:check
      - run: pnpm ui:licenses
      - run: pnpm licenses:check
      - run: pnpm tauri:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-whisper-windows-x64
          path: target/release/bundle/nsis/*.exe
